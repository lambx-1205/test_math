<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>test_math | 数式プレビュー</title>
  <meta name="description" content="KaTeXを使ってLaTeX数式をリアルタイムにプレビューするシンプルなエディタです。">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css"
    integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp"
    crossorigin="anonymous">
  <script defer
    src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"
    integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZ1R1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk"
    crossorigin="anonymous"></script>
  <script defer
    src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js"
    integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
    crossorigin="anonymous"></script>

  <style>
    :root {
      color-scheme: light;
      --ink: #182230;
      --muted: #657187;
      --line: #e1e7f0;
      --panel: #ffffff;
      --canvas: #f5f7fb;
      --accent: #4658d8;
      --accent-soft: #eef0ff;
      --shadow: 0 12px 34px rgba(28, 43, 77, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 0%, rgba(70, 88, 216, 0.07), transparent 32rem),
        var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    .app-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px 30px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 13px;
      background: var(--accent);
      color: white;
      box-shadow: 0 7px 15px rgba(70, 88, 216, 0.23);
      font-size: 23px;
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.3vw, 27px);
      font-weight: 760;
      letter-spacing: -0.035em;
    }

    .version-pill {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid #dfe3ff;
      border-radius: 999px;
      background: #f0f2ff;
      color: #3e4dc0;
      font-size: 12px;
      font-weight: 700;
    }

    .intro {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      display: flex;
      min-width: 0;
      min-height: min(650px, calc(100vh - 240px));
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .panel-icon {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      border-radius: 9px;
      background: #f0f2f7;
      color: #58647a;
      font-size: 14px;
      font-weight: 800;
    }

    .output-panel .panel-icon {
      background: var(--accent-soft);
      color: var(--accent);
    }

    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 750;
    }

    .panel-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .panel-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
    }

    button {
      min-height: 33px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      color: #475166;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    button:hover {
      border-color: #c6cdef;
      background: #f7f8ff;
    }

    button:active { transform: translateY(1px); }

    button:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(70, 88, 216, 0.25);
      outline-offset: 2px;
    }

    .editor-area {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 14px;
    }

    textarea {
      width: 100%;
      min-height: 390px;
      flex: 1;
      resize: vertical;
      padding: 17px;
      border: 1px solid #e4e8f0;
      border-radius: 11px;
      outline: none;
      background: #fbfcff;
      color: #243047;
      font: 13px/1.85 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    textarea:focus {
      border-color: #aeb8f3;
      background: white;
    }

    .editor-hint {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 4px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    code {
      padding: 2px 5px;
      border: 1px solid #e8ebf2;
      border-radius: 5px;
      background: #f7f8fb;
      color: #44516a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #3d8067;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.error { color: #b45309; }

    .preview-wrap {
      flex: 1;
      padding: 25px 24px;
      overflow: auto;
    }

    #preview {
      min-height: 100%;
      color: #273347;
      font-size: 15px;
      line-height: 1.95;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #preview .katex-display {
      max-width: 100%;
      margin: 1.15em 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 3px 0;
    }

    #preview .katex-error {
      color: #b42318;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92em;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 17px;
      color: #8a94a6;
      font-size: 11px;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .app-shell { padding: 22px 16px; }
      .workbench { grid-template-columns: minmax(0, 1fr); }
      .panel { min-height: 480px; }
      textarea { min-height: 330px; }
      .preview-wrap { min-height: 350px; }
    }

    @media (max-width: 430px) {
      .topbar { align-items: flex-start; }
      .version-pill { margin-top: 5px; }
      .panel-heading { align-items: flex-start; padding: 13px; }
      .panel-actions { flex-direction: column; }
      .editor-area { padding: 10px; }
      textarea { padding: 12px; font-size: 12px; }
      .preview-wrap { padding: 19px 15px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">∑</div>
        <div>
          <p class="eyebrow">test_math</p>
          <h1>数式プレビュー</h1>
        </div>
      </div>
      <div class="version-pill">KaTeX 0.19.0</div>
    </header>

    <p class="intro">
      左側に LaTeX を入力すると、右側に数式がリアルタイムで表示されます。
      表示数式は <code>$$ ... $$</code> または <code>\[ ... \]</code>、
      文中の数式は <code>$ ... $</code> または <code>\( ... \)</code> で囲んでください。
    </p>

    <section class="workbench" aria-label="数式エディタ">
      <section class="panel editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading">
          <div class="panel-title-wrap">
            <div class="panel-icon" aria-hidden="true">⌘</div>
            <div>
              <h2 id="editor-title">入力</h2>
              <p class="panel-subtitle">LaTeX ソース</p>
            </div>
          </div>
          <div class="panel-actions">
            <button id="sample-button" type="button">サンプル</button>
            <button id="clear-button" type="button">クリア</button>
          </div>
        </div>
        <div class="editor-area">
          <label for="source" class="eyebrow">SOURCE EDITOR</label>
          <textarea id="source" spellcheck="false" aria-label="LaTeX 入力欄" autocapitalize="off" autocomplete="off"></textarea>
          <div class="editor-hint">
            <span><code>$...$</code> 文中　<code>$$...$$</code> 別行</span>
            <span id="char-count">0 文字</span>
          </div>
        </div>
      </section>

      <section class="panel output-panel" aria-labelledby="preview-title">
        <div class="panel-heading">
          <div class="panel-title-wrap">
            <div class="panel-icon" aria-hidden="true">∑</div>
            <div>
              <h2 id="preview-title">出力</h2>
              <p class="panel-subtitle">レンダリング結果</p>
            </div>
          </div>
          <div id="status" class="status" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">準備中</span>
          </div>
        </div>
        <div class="preview-wrap">
          <div id="preview" aria-label="数式のプレビュー"></div>
        </div>
      </section>
    </section>

    <footer class="footer">
      <span>Powered by KaTeX · 入力内容はこのページ内で処理されます。</span>
      <span>GitHub Pages 用の静的ページ</span>
    </footer>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const source = document.getElementById("source");
      const preview = document.getElementById("preview");
      const status = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const charCount = document.getElementById("char-count");
      const sampleButton = document.getElementById("sample-button");
      const clearButton = document.getElementById("clear-button");

      const sample = [
        "インライン数式は $a^2+b^2=c^2$ のように文章中に置けます。",
        "",
        "ディスプレイ数式：",
        "",
        "$$",
        "\\int_0^1 x^2\\,dx=\\frac{1}{3}",
        "$$",
        "",
        "集合の例：",
        "",
        "\\[",
        "A\\cap B = \\{x\\mid x\\in A,\\ x\\in B\\}",
        "\\]"
      ].join("\n");

      function renderPreview() {
        const text = source.value;
        charCount.textContent = text.length.toLocaleString("ja-JP") + " 文字";
        preview.textContent = text;

        if (typeof window.renderMathInElement !== "function") {
          status.classList.add("error");
          statusText.textContent = "KaTeXを読み込めません";
          return;
        }

        try {
          window.renderMathInElement(preview, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\\[", right: "\\]", display: true },
              { left: "\\(", right: "\\)", display: false },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false,
            strict: "ignore",
            ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
          });
          status.classList.remove("error");
          statusText.textContent = "プレビュー更新済み";
        } catch (error) {
          status.classList.add("error");
          statusText.textContent = "描画エラー";
          console.error("KaTeX render error:", error);
        }
      }

      source.addEventListener("input", renderPreview);
      sampleButton.addEventListener("click", function () {
        source.value = sample;
        renderPreview();
        source.focus();
      });
      clearButton.addEventListener("click", function () {
        source.value = "";
        renderPreview();
        source.focus();
      });

      source.value = sample;
      renderPreview();
    });
  </script>
</body>
</html>
