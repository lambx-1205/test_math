<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>UTILITY HUB</title>
  <meta name="description" content="LaTeXメモ帳、万能電卓、画像編集、PDF編集・ファイル圧縮。">
  <style>
    :root {
      color-scheme: light;
      --ink: #182230;
      --muted: #657187;
      --line: #e1e7f0;
      --panel: #ffffff;
      --canvas: #f5f7fb;
      --accent: #4658d8;
      --accent-soft: #eef0ff;
      --shadow: 0 12px 34px rgba(28, 43, 77, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 0%, rgba(70, 88, 216, 0.08), transparent 34rem),
        var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    a { color: inherit; }
    .shell { width: min(1120px, 100%); margin: 0 auto; padding: 34px 28px 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 62px; }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      display: grid; width: 44px; height: 44px; flex: 0 0 44px; place-items: center;
      border-radius: 14px; background: var(--accent); color: #fff;
      box-shadow: 0 7px 15px rgba(70, 88, 216, 0.23); font-size: 22px; font-weight: 800;
    }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .16em; }
    .brand-name { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
    .top-note { color: var(--muted); font-size: 12px; }
    .hero { max-width: 760px; margin-bottom: 37px; }
    .hero-kicker {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px;
      border: 1px solid #dfe3ff; border-radius: 999px; background: #f0f2ff;
      color: #3e4dc0; font-size: 11px; font-weight: 750;
    }
    h1 { margin: 19px 0 12px; font-size: clamp(34px, 6vw, 55px); line-height: 1.15; letter-spacing: -.055em; }
    .hero p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.9; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 0 0 15px; }
    h2 { margin: 0; font-size: 16px; font-weight: 800; }
    .section-caption { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .tools-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .featured {
      position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto;
      align-items: center; gap: 24px; min-height: 220px; padding: 30px;
      overflow: hidden; border: 1px solid #dce2f4; border-radius: 20px;
      background: linear-gradient(120deg, #fff 0%, #f8f9ff 100%); box-shadow: var(--shadow);
      text-decoration: none; transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }
    .featured:hover { transform: translateY(-2px); border-color: #b9c3f3; box-shadow: 0 16px 38px rgba(28,43,77,.10); }
    .featured-copy { position: relative; z-index: 1; min-width: 0; }
    .tool-label { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    .featured h3 { margin: 9px 0 8px; font-size: 25px; letter-spacing: -.04em; }
    .featured p { max-width: 590px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 17px; }
    .chip { padding: 5px 9px; border: 1px solid #e0e5f0; border-radius: 7px; background: #fff; color: #566177; font-size: 10px; font-weight: 650; }
    .tool-icon {
      display: grid; width: 112px; height: 112px; flex: 0 0 112px; place-items: center;
      border-radius: 25px; background: var(--accent-soft); color: var(--accent);
      font-family: Georgia, serif; font-size: 55px; font-weight: 700;
    }
    .open-label {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 19px;
      color: var(--accent); font-size: 12px; font-weight: 800;
    }
    .open-arrow { font-size: 17px; transition: transform 150ms ease; }
    .featured:hover .open-arrow { transform: translateX(4px); }
    .coming-section { margin-top: 35px; }
    .coming-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .coming-card {
      min-height: 112px; padding: 17px; border: 1px solid var(--line); border-radius: 13px;
      background: rgba(255,255,255,.7);
    }
    .coming-icon { display: inline-grid; width: 28px; height: 28px; place-items: center; margin-bottom: 10px; border-radius: 8px; background: #f0f2f7; color: #657187; font-size: 14px; }
    .coming-card h3 { margin: 0; font-size: 13px; }
    .coming-card p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .status { display: inline-block; margin-left: 6px; color: #8b94a5; font-size: 9px; font-weight: 700; }
    footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 15px; border-top: 1px solid var(--line); color: #8a94a6; font-size: 10px; }
    @media (max-width: 650px) {
      .shell { padding: 23px 16px; }
      .topbar { margin-bottom: 43px; }
      .top-note { display: none; }
      .tools-grid { grid-template-columns:minmax(0,1fr); }
      .featured { grid-template-columns: minmax(0,1fr); padding: 23px; }
      .tool-icon { display: none; }
      .coming-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 390px) {
      .coming-grid { grid-template-columns: minmax(0,1fr); }
      footer { flex-direction: column; }
    }
  
    /* Minimal tool directory */
    .shell { padding-top: 28px; }
    .topbar { margin-bottom: 24px; }
    .brand { gap: 12px; }
    .brand .brand-name { font-size: 19px; }
    .tools-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .featured { display: block; min-height: 0; padding: 22px; }
    .featured-copy { min-height: 0; }
    .featured h3 { margin: 0 0 8px; font-size: 20px; }
    .featured p { line-height: 1.7; }
    .tool-label, .chips, .tool-icon { display: none !important; }
    .open-label { margin-top: 13px; }
    @media (max-width: 650px) { .tools-grid { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">U</div>
        <p class="brand-name">UTILITY HUB</p>
      </div>
    </header>
    <section aria-label="ツール">
      <div class="tools-grid">
        <a class="featured" href="latex-memo.html" aria-label="LaTeX メモ帳を開く">
          <div class="featured-copy">
            <h3>LaTeX メモ帳</h3>
            <p>Markdown・LaTeXの入力、数式プレビュー、メモ保存。</p>
            <span class="open-label">開く <span class="open-arrow" aria-hidden="true">→</span></span>
          </div>
        </a>
        <a class="featured" href="calculator.html" aria-label="万能電卓を開く">
          <div class="featured-copy">
            <h3>万能電卓</h3>
            <p>科学計算、複素数・行列、単位変換、計算履歴。</p>
            <span class="open-label">開く <span class="open-arrow" aria-hidden="true">→</span></span>
          </div>
        </a>
        <a class="featured" href="image-editor.html" aria-label="画像編集を開く">
          <div class="featured-copy">
            <h3>画像編集</h3>
            <p>反転・対称化、モザイク、色調補正、トリミング、リサイズ。</p>
            <span class="open-label">開く <span class="open-arrow" aria-hidden="true">→</span></span>
          </div>
        </a>
        <a class="featured" href="file-editor.html" aria-label="ファイル・PDF編集を開く">
          <div class="featured-copy">
            <h3>ファイル / PDF編集</h3>
            <p>PDF閲覧・ページ編集、ZIP / GZIP圧縮。</p>
            <span class="open-label">開く <span class="open-arrow" aria-hidden="true">→</span></span>
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
