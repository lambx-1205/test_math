<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>gifラー | UTILITY HUB</title>
<style>
:root{color-scheme:light;--ink:#182230;--muted:#657187;--line:#e1e7f0;--panel:#fff;--canvas:#f5f7fb;--accent:#4658d8;--soft:#eef0ff;--shadow:0 12px 34px rgba(28,43,77,.06)}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(ellipse at 8% 0%,rgba(70,88,216,.08),transparent 34rem),var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.shell{width:min(1120px,100%);margin:auto;padding:25px 24px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.back{color:var(--muted);font-size:13px}.brand{font-weight:800;font-size:18px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.8fr);gap:18px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}h1{font-size:25px;margin:0 0 6px;letter-spacing:-.04em}.sub{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.7}.drop{position:relative;display:grid;place-items:center;min-height:125px;border:1.5px dashed #bfc8dc;border-radius:12px;background:#fafbff;text-align:center;padding:18px;cursor:pointer}.drop.drag{border-color:var(--accent);background:var(--soft)}.drop strong{display:block;margin-bottom:5px}.drop small{color:var(--muted)}.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.frames{display:grid;gap:8px;margin-top:13px}.frame{display:grid;grid-template-columns:54px minmax(0,1fr) 90px auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}.frame img{width:54px;height:48px;object-fit:contain;background:#f3f5f9;border-radius:6px}.fname{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame label{font-size:10px;color:var(--muted)}.frame input{width:100%;margin-top:3px;padding:5px;border:1px solid var(--line);border-radius:6px;font-size:12px}.frame-actions{display:flex;gap:3px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:11px}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin:0 0 14px}.field>label{font-size:12px;font-weight:750}.field input[type=number],.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.check{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:12px}.hint{font-size:11px;color:var(--muted);line-height:1.7}.preview{margin-top:16px;border:1px solid var(--line);border-radius:12px;min-height:180px;display:grid;place-items:center;padding:12px;background:repeating-conic-gradient(#f1f3f7 0% 25%,#fff 0% 50%) 50%/18px 18px}.preview img{max-width:100%;max-height:420px;object-fit:contain}.status{min-height:20px;margin:10px 0;color:var(--muted);font-size:11px}.download{display:none;margin-top:10px}.download.show{display:inline-flex}.output-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.output-actions .btn{margin:0}.busy{opacity:.6;pointer-events:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.shell{padding:18px 13px 32px}}@media(max-width:470px){.panel{padding:14px}.frame{grid-template-columns:44px minmax(0,1fr) 76px}.frame img{width:44px;height:42px}.frame-actions{grid-column:2/-1;justify-content:flex-end}.frame label{font-size:9px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><a class="back" href="index.html">← UTILITY HUB</a><div class="brand">gifラー</div></header>
<div class="layout">
<section class="panel">
<h1>GIFを作成</h1><p class="sub">画像を1枚以上読み込み、順番と表示時間を調整してGIFに変換します。</p>
<label class="drop" id="drop"><span><strong>画像を選択 / ここにドロップ</strong><small>PNG・JPEG・WebP など。複数選択できます。</small></span><input id="files" type="file" accept="image/*" multiple></label>
<div class="toolbar"><button class="btn" id="add" type="button">画像を追加</button><button class="btn" id="clear" type="button">すべて削除</button></div>
<div id="frames" class="frames"><div class="empty">画像がまだありません</div></div>
</section>
<aside class="panel">
<h1>出力設定</h1>
<div class="field"><label for="width">幅（px）</label><input id="width" type="number" min="16" max="1600" value="480"></div>
<div class="field"><label for="height">高さ（px）</label><input id="height" type="number" min="16" max="1600" value="480"></div>
<div class="field"><label for="fit">画像の配置</label><select id="fit"><option value="contain">全体を表示（余白あり）</option><option value="cover">枠いっぱいに表示（端を切り取り）</option><option value="stretch">縦横比を無視して引き伸ばす</option></select></div>
<div class="field"><label for="repeat">ループ</label><select id="repeat"><option value="0">無限ループ</option><option value="1">1回</option><option value="2">2回</option><option value="3">3回</option><option value="5">5回</option></select></div>
<label class="check"><input id="reverse" type="checkbox">逆順で再生</label>
<label class="check"><input id="pingpong" type="checkbox">往復再生（最後から逆戻り）</label>
<p class="hint">各画像の表示時間はフレームごとに設定できます。GIFの仕様上、時間はおおむね10ms単位に丸められます。</p>
<button class="btn primary" id="make" type="button" style="width:100%;padding:12px">GIFを作成</button>
<div class="status" id="status" role="status"></div>
<div class="preview" id="preview"><span class="hint">完成したGIFがここに表示されます</span></div>
<div class="output-actions"><a class="btn primary download" id="download" download="animation.gif">GIFを保存</a><button class="btn" id="copy" type="button" disabled>GIFをコピー</button></div>
</aside>
</div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let frames=[], outputUrl=null, outputBlob=null, busy=false, gifModulePromise=null;

async function loadGifEncoder(){
 if(!gifModulePromise){
  gifModulePromise=import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js').then(mod=>{
   if(typeof mod.GIFEncoder!=='function'||typeof mod.quantize!=='function'||typeof mod.applyPalette!=='function'){
    throw new Error('GIF生成ライブラリのAPIを確認できませんでした。');
   }
   return mod;
  }).catch(err=>{gifModulePromise=null;throw err;});
 }
 return gifModulePromise;
}
const files=$('files'), list=$('frames'), drop=$('drop'), status=$('status');
function render(){
 list.replaceChildren();
 if(!frames.length){const e=document.createElement('div');e.className='empty';e.textContent='画像がまだありません';list.append(e);return;}
 frames.forEach((f,i)=>{
  const row=document.createElement('div');row.className='frame';
  const img=document.createElement('img');img.src=f.url;img.alt='';
  const name=document.createElement('div');name.className='fname';name.textContent=f.file.name;
  const time=document.createElement('label');time.textContent='表示時間 (ms)';
  const input=document.createElement('input');input.type='number';input.min='20';input.max='10000';input.step='10';input.value=f.delay;input.setAttribute('aria-label',f.file.name+'の表示時間');input.addEventListener('change',()=>{f.delay=Math.max(20,Math.min(10000,Number(input.value)||100));input.value=f.delay;});
  time.append(input);
  const actions=document.createElement('div');actions.className='frame-actions';
  [['↑',()=>move(i,-1),'先頭へ移動'],['↓',()=>move(i,1),'後ろへ移動'],['×',()=>remove(i),'削除']].forEach(([label,fn,title])=>{const b=document.createElement('button');b.type='button';b.className='iconbtn';b.textContent=label;b.title=title;b.disabled=(label==='↑'&&i===0)||(label==='↓'&&i===frames.length-1);b.addEventListener('click',fn);actions.append(b);});
  row.append(img,name,time,actions);list.append(row);
 });
}
function move(i,d){const j=i+d;if(j<0||j>=frames.length)return;[frames[i],frames[j]]=[frames[j],frames[i]];render();}
function remove(i){URL.revokeObjectURL(frames[i].url);frames.splice(i,1);render();}
function addFiles(fileList){
 const incoming=Array.from(fileList||[]).filter(file=>file.type.startsWith('image/')||/\\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(file.name));
 if(!incoming.length){status.textContent='画像ファイルを選択してください。';files.value='';return;}
 const jobs=incoming.map(file=>new Promise(resolve=>{
  const url=URL.createObjectURL(file), image=new Image();
  image.onload=()=>resolve({file,url,width:image.naturalWidth,height:image.naturalHeight,delay:500});
  image.onerror=()=>{URL.revokeObjectURL(url);status.textContent=file.name+' を読み込めませんでした。';resolve(null);};
  image.src=url;
 }));
 Promise.all(jobs).then(loaded=>{
  const valid=loaded.filter(Boolean);
  frames.push(...valid);render();
  status.textContent=valid.length+'枚の画像を追加しました。'+(valid.length<incoming.length?' 一部の画像を読み込めませんでした。':'');
 });
 files.value='';
}
files.addEventListener('change',e=>addFiles(e.target.files));
$('add').addEventListener('click',()=>files.click());
drop.addEventListener('click',e=>{if(e.target!==files)files.click();});
$('clear').addEventListener('click',()=>{frames.forEach(f=>URL.revokeObjectURL(f.url));frames=[];render();});
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
function drawFrame(frame,w,h,fit){
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const c=canvas.getContext('2d',{willReadFrequently:true});
 c.fillStyle='#fff';c.fillRect(0,0,w,h);
 const im=new Image();return new Promise((resolve,reject)=>{im.onload=()=>{let dw=w,dh=h,dx=0,dy=0;const sx=w/im.naturalWidth,sy=h/im.naturalHeight;if(fit==='contain'){const s=Math.min(sx,sy);dw=im.naturalWidth*s;dh=im.naturalHeight*s;dx=(w-dw)/2;dy=(h-dh)/2;}else if(fit==='cover'){const s=Math.max(sx,sy);dw=im.naturalWidth*s;dh=im.naturalHeight*s;dx=(w-dw)/2;dy=(h-dh)/2;}c.drawImage(im,dx,dy,dw,dh);resolve(c.getImageData(0,0,w,h));};im.onerror=reject;im.src=frame.url;});
}
$('make').addEventListener('click',async()=>{
 if(busy)return;if(!frames.length){status.textContent='先に画像を1枚以上追加してください。';return;}
 const w=Math.round(Number($('width').value)),h=Math.round(Number($('height').value));
 if(!Number.isFinite(w)||!Number.isFinite(h)||w<16||h<16||w>1600||h>1600){status.textContent='幅と高さは16〜1600pxで指定してください。';return;}
 busy=true;$('make').disabled=true;document.body.classList.add('busy');status.textContent='GIF生成ライブラリを読み込んでいます…';$('download').classList.remove('show');$('copy').disabled=true;
 try{
  const {GIFEncoder,quantize,applyPalette}=await loadGifEncoder();
  status.textContent='GIFを生成しています…';
  const sequence=frames.slice();if($('reverse').checked)sequence.reverse();if($('pingpong').checked&&sequence.length>1)sequence.push(...sequence.slice(0,-1).reverse());
  const enc=GIFEncoder();const fit=$('fit').value;const repeat=Number($('repeat').value);
  for(let i=0;i<sequence.length;i++){
   status.textContent='フレームを処理中… '+(i+1)+' / '+sequence.length;
   const image=await drawFrame(sequence[i],w,h,fit);const palette=quantize(image.data,256);const indexed=applyPalette(image.data,palette);
   enc.writeFrame(indexed,w,h,{palette,delay:Math.max(20,Math.round(sequence[i].delay/10)*10),repeat:i===0?repeat:undefined});
  }
  enc.finish();const blob=new Blob([enc.bytes()],{type:'image/gif'});
  if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(blob);
  const img=document.createElement('img');img.src=outputUrl;img.alt='作成したGIF';$('preview').replaceChildren(img);
  $('download').href=outputUrl;$('download').classList.add('show');$('download').textContent='GIFを保存（'+(blob.size/1024).toFixed(1)+' KB）';$('copy').disabled=false;status.textContent='完成しました。 '+w+' × '+h+' px / '+sequence.length+' フレーム';
 }catch(err){console.error(err);status.textContent='作成に失敗しました。画像形式やメモリ容量を確認してください。';}
 finally{busy=false;$('make').disabled=false;document.body.classList.remove('busy');}
});
function blobToDataURL(blob){
 return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});
}
$('copy').addEventListener('click',async()=>{
 if(!outputBlob)return;
 const button=$('copy');button.disabled=true;
 try{
  if(navigator.clipboard&&window.ClipboardItem&&typeof ClipboardItem.supports==='function'&&ClipboardItem.supports('image/gif')){
   await navigator.clipboard.write([new ClipboardItem({'image/gif':outputBlob})]);
   status.textContent='GIF画像をクリップボードにコピーしました。';
  }else if(navigator.clipboard&&navigator.clipboard.writeText){
   await navigator.clipboard.writeText(await blobToDataURL(outputBlob));
   status.textContent='このブラウザーはGIF画像の直接コピーに未対応のため、GIFデータURLをテキストとしてコピーしました。';
  }else{
   throw new Error('この環境ではクリップボードへの書き込みが利用できません。GIFを保存してください。');
  }
 }catch(err){
  status.textContent='コピーできませんでした。ブラウザーのクリップボード権限を確認するか、GIFを保存してください。 ('+err.message+')';
 }finally{button.disabled=false;}
});
window.addEventListener('beforeunload',()=>{frames.forEach(f=>URL.revokeObjectURL(f.url));if(outputUrl)URL.revokeObjectURL(outputUrl);});
</script>
</body></html>
