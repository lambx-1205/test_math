<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>UTILITY HUB | LaTeX メモ帳</title>
  <meta name="description" content="MarkdownとLaTeXに対応したブラウザ内メモ帳。数式のプレビュー、複数カーソル編集、タイトル付き保存に対応します。">

  <link id="katex-css" rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css"
    onerror="this.onerror=null;this.href='https://unpkg.com/katex@0.19.0/dist/katex.min.css';">

  <style>
    :root {
      color-scheme: light;
      --ink: #182230;
      --muted: #657187;
      --line: #e1e7f0;
      --panel: #ffffff;
      --canvas: #f5f7fb;
      --accent: #4658d8;
      --accent-soft: #eef0ff;
      --shadow: 0 12px 34px rgba(28, 43, 77, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 0%, rgba(70, 88, 216, 0.07), transparent 32rem),
        var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    .app-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px 30px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .topbar-leading {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 13px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 13px;
      background: var(--accent);
      color: white;
      box-shadow: 0 7px 15px rgba(70, 88, 216, 0.23);
      font-size: 23px;
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.3vw, 27px);
      font-weight: 760;
      letter-spacing: -0.035em;
    }

    .version-pill {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid #dfe3ff;
      border-radius: 999px;
      background: #f0f2ff;
      color: #3e4dc0;
      font-size: 12px;
      font-weight: 700;
    }

    .home-link {
      display: inline-block;
      color: #3e4dc0;
      text-decoration: none;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .home-link:hover {
      border-color: #c6cdef;
      background: #e8ebff;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex: 0 0 auto;
    }

    .memo-menu-button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid #dfe3ff;
      border-radius: 11px;
      background: #fff;
      color: #3e4dc0;
      box-shadow: 0 4px 12px rgba(70, 88, 216, 0.08);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .memo-menu-button:hover {
      border-color: #aeb8f3;
      background: #f0f2ff;
    }

    .memo-menu-icon {
      font-size: 18px;
      line-height: 1;
    }

    .memo-menu-count {
      display: inline-grid;
      min-width: 19px;
      height: 19px;
      place-items: center;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .intro {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      display: flex;
      min-width: 0;
      min-height: min(650px, calc(100vh - 240px));
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .panel-icon {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      border-radius: 9px;
      background: #f0f2f7;
      color: #58647a;
      font-size: 14px;
      font-weight: 800;
    }

    .output-panel .panel-icon {
      background: var(--accent-soft);
      color: var(--accent);
    }

    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 750;
    }

    .panel-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .panel-actions {
      display: flex;
      flex: 0 1 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .panel-actions button {
      white-space: nowrap;
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .memo-drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(18, 27, 45, 0.34);
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .memo-drawer-backdrop.is-visible {
      opacity: 1;
    }

    .memo-drawer {
      position: fixed;
      z-index: 1001;
      top: 0;
      right: 0;
      display: flex;
      width: min(460px, 94vw);
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      gap: 12px;
      padding: 19px;
      border-left: 1px solid var(--line);
      background: var(--panel);
      box-shadow: -18px 0 48px rgba(20, 32, 58, 0.16);
      transform: translateX(102%);
      visibility: hidden;
      transition: transform 240ms ease, visibility 240ms;
    }

    .memo-drawer.is-open {
      transform: translateX(0);
      visibility: visible;
      transition-delay: 0s;
    }

    .memo-drawer-header {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
    }

    .memo-drawer-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .memo-drawer-title h2 {
      font-size: 16px;
    }

    .memo-drawer-close {
      width: 36px;
      min-width: 36px;
      min-height: 36px;
      padding: 0;
      font-size: 20px;
    }

    .memo-drawer-description {
      flex: 0 0 auto;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .memo-drawer-meta {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .memo-drawer-tools {
      display: grid;
      flex: 0 0 auto;
      gap: 9px;
    }

    .saved-search-input {
      width: 100%;
      min-width: 0;
      min-height: 41px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #fbfcff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }

    .saved-search-input:focus {
      border-color: #aeb8f3;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(70, 88, 216, 0.10);
    }

    .saved-tools-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 7px;
      align-items: center;
    }

    .saved-sort-select {
      width: 100%;
      min-width: 0;
      min-height: 35px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: #475166;
      font: inherit;
      font-size: 11px;
    }

    .saved-filter-button[aria-pressed="true"] {
      border-color: #e2c36d;
      background: #fff8df;
      color: #77580a;
    }

    .saved-export-button {
      white-space: nowrap;
    }

    .memo-drawer .saved-notes {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1px 3px 12px 1px;
    }

    body.memo-drawer-open {
      overflow: hidden;
    }

    button {
      min-height: 33px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      color: #475166;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    button:hover {
      border-color: #c6cdef;
      background: #f7f8ff;
    }

    button:active { transform: translateY(1px); }

    button:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(70, 88, 216, 0.25);
      outline-offset: 2px;
    }

    .editor-area {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 14px;
    }

    textarea {
      width: 100%;
      min-height: 390px;
      flex: 1;
      resize: vertical;
      padding: 17px;
      border: 1px solid #e4e8f0;
      border-radius: 11px;
      outline: none;
      background: #fbfcff;
      color: #243047;
      font: 13px/1.85 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    textarea:focus {
      border-color: #aeb8f3;
      background: white;
    }

    .source-editor {
      display: flex;
      flex: 1 1 auto;
      min-height: 390px;
      overflow: hidden;
      border: 1px solid #e4e8f0;
      border-radius: 11px;
      background: #fbfcff;
    }

    .source-editor:focus-within {
      border-color: #aeb8f3;
      background: white;
    }

    .source-editor[hidden] {
      display: none;
    }

    #source[hidden] {
      display: none !important;
    }

    .source-editor .cm-editor {
      width: 100%;
      height: 100%;
      min-height: 390px;
      background: transparent;
      color: #243047;
      font-size: 13px;
    }

    .source-editor .cm-scroller {
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      line-height: 1.85;
    }

    .source-editor .cm-content {
      padding: 17px 0;
      caret-color: var(--accent);
    }

    .source-editor .cm-line {
      padding: 0 17px;
    }

    .source-editor .cm-gutters {
      border-right: 1px solid #e4e8f0;
      background: #f7f8fc;
      color: #8993a6;
    }

    .source-editor .cm-cursor {
      border-left-color: var(--accent);
    }

    .source-editor .cm-selectionBackground,
    .source-editor .cm-content ::selection {
      background: rgba(70, 88, 216, 0.18);
    }

    .source-editor .cm-editor.cm-focused {
      outline: none;
    }

    .editor-hint {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 4px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    code {
      padding: 2px 5px;
      border: 1px solid #e8ebf2;
      border-radius: 5px;
      background: #f7f8fb;
      color: #44516a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #3d8067;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.error { color: #b45309; }

    .preview-wrap {
      flex: 1;
      padding: 25px 24px;
      overflow: auto;
    }

    #preview {
      min-height: 100%;
      color: #273347;
      font-size: 15px;
      line-height: 1.95;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #preview,
    .saved-note-rendered {
      overflow-wrap: anywhere;
      line-height: 1.55;
    }

    #preview.markdown-rendered,
    .saved-note-rendered.markdown-rendered {
      white-space: normal;
      line-height: 1.5;
    }

    #preview.markdown-rendered p,
    .saved-note-rendered.markdown-rendered p {
      margin: 0.3em 0;
    }

    #preview.markdown-rendered h1,
    #preview.markdown-rendered h2,
    #preview.markdown-rendered h3,
    #preview.markdown-rendered h4,
    .saved-note-rendered.markdown-rendered h1,
    .saved-note-rendered.markdown-rendered h2,
    .saved-note-rendered.markdown-rendered h3,
    .saved-note-rendered.markdown-rendered h4 {
      margin: 0.75em 0 0.3em;
    }

    #preview.markdown-rendered ul,
    #preview.markdown-rendered ol,
    .saved-note-rendered.markdown-rendered ul,
    .saved-note-rendered.markdown-rendered ol {
      margin: 0.25em 0;
    }

    #preview.markdown-rendered li,
    .saved-note-rendered.markdown-rendered li {
      margin: 0.08em 0;
    }

    #preview.markdown-rendered blockquote,
    .saved-note-rendered.markdown-rendered blockquote {
      margin: 0.45em 0;
    }

    .math-display-wrapper {
      display: block;
      margin: 0.35em 0;
      text-align: center;
    }

    #preview.markdown-rendered .katex-display,
    .saved-note-rendered.markdown-rendered .katex-display {
      margin: 0;
    }

    #preview h1, #preview h2, #preview h3, #preview h4,
    .saved-note-rendered h1, .saved-note-rendered h2,
    .saved-note-rendered h3, .saved-note-rendered h4 {
      margin: 1.15em 0 0.55em;
      line-height: 1.35;
    }

    #preview h1, .saved-note-rendered h1 { font-size: 1.65em; }
    #preview h2, .saved-note-rendered h2 { font-size: 1.4em; }
    #preview h3, .saved-note-rendered h3 { font-size: 1.2em; }
    #preview p, .saved-note-rendered p { margin: 0.65em 0; }
    #preview ul, #preview ol,
    .saved-note-rendered ul, .saved-note-rendered ol { padding-left: 1.7em; }
    #preview blockquote, .saved-note-rendered blockquote {
      margin: 0.9em 0;
      padding: 0.15em 1em;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    #preview pre, .saved-note-rendered pre {
      overflow-x: auto;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #f5f7fb;
      white-space: pre;
    }
    #preview code, .saved-note-rendered code {
      padding: 0.12em 0.32em;
      border-radius: 4px;
      background: #f0f2f7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    #preview pre code, .saved-note-rendered pre code {
      padding: 0;
      background: transparent;
    }
    #preview table, .saved-note-rendered table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      display: block;
      overflow-x: auto;
    }
    #preview th, #preview td,
    .saved-note-rendered th, .saved-note-rendered td {
      padding: 7px 10px;
      border: 1px solid var(--line);
      text-align: left;
    }
    #preview th, .saved-note-rendered th { background: #f5f7fb; }
    #preview hr, .saved-note-rendered hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.3em 0;
    }
    #preview img, .saved-note-rendered img { max-width: 100%; height: auto; }
    #preview a, .saved-note-rendered a { color: var(--accent); }

    #preview .katex,
    .saved-note-rendered .katex {
      margin-inline: 0.16em;
    }

    #preview .katex-display .katex,
    .saved-note-rendered .katex-display .katex {
      margin-inline: 0;
    }

    #preview .katex-display {
      max-width: 100%;
      margin: 1.15em 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 3px 0;
    }

    #preview .katex-error {
      color: #b42318;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92em;
    }

    .primary-button {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .primary-button:hover {
      border-color: #3645bd;
      background: #3645bd;
      color: #fff;
    }

    .character-count-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      padding: 17px 21px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .character-count-label {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 750;
    }

    .character-count-hint {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .character-count-value {
      color: var(--accent);
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 780;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .saved-section {
      margin-top: 22px;
      padding: 21px 22px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .saved-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .saved-heading {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .saved-count {
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .saved-description {
      margin: 9px 0 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .saved-feedback {
      margin: 0 0 12px;
      color: #3d8067;
      font-size: 12px;
      line-height: 1.6;
    }

    .saved-feedback.error { color: #b45309; }

    .saved-notes {
      display: grid;
      gap: 12px;
    }

    .saved-empty {
      padding: 27px 18px;
      border: 1px dashed #dbe1eb;
      border-radius: 12px;
      color: #8a94a6;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .saved-note {
      min-width: 0;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fcfdff;
    }

    .saved-note-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .saved-note-heading {
      display: flex;
      flex: 1 1 auto;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    .saved-note-title {
      flex: 0 1 auto;
      max-width: 48%;
      min-width: 0;
      margin: 0;
      color: #273347;
      font-size: 14px;
      font-weight: 750;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .saved-note-excerpt {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .saved-note-date {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .saved-note-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
    }

    /* In the side drawer, give memo titles a full line instead of squeezing
       them beside the excerpt and action buttons. Long titles are ellipsized. */
    .memo-drawer .saved-note-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 8px;
    }

    .memo-drawer .saved-note-heading {
      display: flex;
      width: 100%;
      min-width: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
    }

    .memo-drawer .saved-note-title {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      flex: 0 1 auto;
      overflow: hidden;
      overflow-wrap: normal;
      word-break: normal;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .memo-drawer .saved-note-excerpt {
      width: 100%;
      flex: 0 1 auto;
    }

    .memo-drawer .saved-note-actions {
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .saved-note-favorite {
      min-width: 34px;
      padding-inline: 8px;

  <script>
    function loadKatex() {
      const sources = [
        "https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js",
        "https://unpkg.com/katex@0.19.0/dist/katex.min.js"
      ];

      return new Promise(function (resolve, reject) {
        let index = 0;

        function tryNextSource() {
          if (index >= sources.length) {
            reject(new Error("KaTeX could not be loaded from either CDN."));
            return;
          }

          const script = document.createElement("script");
          script.src = sources[index++];
          script.async = true;
          script.onload = function () {
            if (window.katex && typeof window.katex.render === "function") {
              resolve();
            } else {
              script.remove();
              tryNextSource();
            }
          };
          script.onerror = function () {
            script.remove();
            tryNextSource();
          };
          document.head.appendChild(script);
        }

        tryNextSource();
      });
    }

    function loadScriptWithFallback(urls, check) {
      return new Promise(function (resolve, reject) {
        let index = 0;
        function next() {
          if (index >= urls.length) {
            reject(new Error("Could not load a required rendering library."));
            return;
          }
          const script = document.createElement("script");
          script.src = urls[index++];
          script.async = true;
          script.onload = function () {
            if (check()) resolve();
            else { script.remove(); next(); }
          };
          script.onerror = function () { script.remove(); next(); };
          document.head.appendChild(script);
        }
        next();
      });
    }

    function loadMarkdownLibraries() {
      return loadScriptWithFallback([
        "https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js",
        "https://unpkg.com/marked@15.0.7/marked.min.js"
      ], function () { return Boolean(window.marked && typeof window.marked.parse === "function"); })
      .then(function () {
        return loadScriptWithFallback([
          "https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js",
          "https://unpkg.com/dompurify@3.2.6/dist/purify.min.js"
        ], function () { return Boolean(window.DOMPurify && typeof window.DOMPurify.sanitize === "function"); });
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const source = document.getElementById("source");
      const sourceEditorHost = document.getElementById("source-editor");
      const preview = document.getElementById("preview");
      const status = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const charCount = document.getElementById("char-count");
      const currentCharacterCount = document.getElementById("current-character-count");
      const sampleButton = document.getElementById("sample-button");
      const clearButton = document.getElementById("clear-button");
      const saveButton = document.getElementById("save-button");
      const overwriteSaveButton = document.getElementById("overwrite-save-button");
      const renameSaveButton = document.getElementById("rename-save-button");
      const copyCurrentButton = document.getElementById("copy-current-button");
      const memoDrawerToggle = document.getElementById("memo-drawer-toggle");
      const memoMenuCount = document.getElementById("memo-menu-count");
      const memoDrawer = document.getElementById("memo-drawer");
      const memoDrawerBackdrop = document.getElementById("memo-drawer-backdrop");
      const closeMemoDrawerButton = document.getElementById("close-memo-drawer");
      const savedNotesContainer = document.getElementById("saved-notes");
      const savedCount = document.getElementById("saved-count");
      const savedFeedback = document.getElementById("saved-feedback");
      const savedSearchInput = document.getElementById("saved-search");
      const savedSortSelect = document.getElementById("saved-sort");
      const savedFavoritesFilter = document.getElementById("saved-favorites-filter");
      const savedExportButton = document.getElementById("saved-export-button");
      const storageKey = "test_math_saved_notes_v1";

      const sample = [
        "インライン数式は $a^2+b^2=c^2$ のように文章中に置けます。",
        "",
        "ディスプレイ数式：",
        "",
        "$$",
        "\\int_0^1 x^2\\,dx=\\frac{1}{3}",
        "$$",
        "",
        "和の公式も、表示数式の区切り記号で囲んで入力します。",
        "$" + "$",
        "\\sum_{k=1}^{n} k=\\frac{n(n+1)}{2}",
        "$" + "$",
        "",
        "集合の例：",
        "",
        "\\[",
        "A\\cap B = \\{x\\mid x\\in A,\\ x\\in B\\}",
        "\\]"
      ].join("\n");

      function readSavedNotes() {
        try {
          const stored = localStorage.getItem(storageKey);
          if (!stored) return [];
          const parsed = JSON.parse(stored);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter(function (note) {
              return note && typeof note.id === "string" &&
                typeof note.content === "string" &&
                typeof note.savedAt === "string";
            })
            .map(function (note) {
              // Keep notes created by older versions readable.
              return {
                ...note,
                title: typeof note.title === "string" && note.title.trim()
                  ? note.title
                  : "無題のメモ"
              };
            });
        } catch (error) {
          console.warn("Saved notes could not be read:", error);
          savedFeedback.textContent = "保存データを読み込めませんでした。ブラウザの保存設定を確認してください。";
          savedFeedback.classList.add("error");
          return [];
        }
      }

      let savedNotes = readSavedNotes();
      let editingNoteId = null;
      let editorView = null;
      let favoritesOnly = false;

      function setEditorContent(value) {
        source.value = value;
        if (editorView) {
          editorView.dispatch({
            changes: {
              from: 0,
              to: editorView.state.doc.length,
              insert: value
            },
            selection: { anchor: value.length }
          });
        } else {
          renderPreview();
        }
      }

      function focusEditor() {
        if (editorView) editorView.focus();
        else source.focus();
      }

      function setEditingNote(note) {
        const existingNote = note && savedNotes.find(function (item) {
          return item.id === note.id;
        });
        editingNoteId = existingNote ? existingNote.id : null;
        renameSaveButton.disabled = !existingNote;
        if (existingNote) {
          overwriteSaveButton.title = "「" + existingNote.title + "」の内容を上書き保存";
          renameSaveButton.title = "「" + existingNote.title + "」の保存名を変更";
        } else {
          overwriteSaveButton.title = "現在の内容を新しいメモとして保存";
          renameSaveButton.title = "保存済みメモを選択すると名前を変更できます";
        }
      }

      function openMemoDrawer() {
        memoDrawerBackdrop.hidden = false;
        requestAnimationFrame(function () {
          memoDrawerBackdrop.classList.add("is-visible");
          memoDrawer.classList.add("is-open");
        });
        memoDrawer.setAttribute("aria-hidden", "false");
        memoDrawerToggle.setAttribute("aria-expanded", "true");
        document.body.classList.add("memo-drawer-open");
        closeMemoDrawerButton.focus();
      }

      function closeMemoDrawer(restoreFocus) {
        memoDrawer.classList.remove("is-open");
        memoDrawerBackdrop.classList.remove("is-visible");
        memoDrawer.setAttribute("aria-hidden", "true");
        memoDrawerToggle.setAttribute("aria-expanded", "false");
        document.body.classList.remove("memo-drawer-open");
        window.setTimeout(function () {
          if (!memoDrawer.classList.contains("is-open")) {
            memoDrawerBackdrop.hidden = true;
          }
        }, 250);
        if (restoreFocus) memoDrawerToggle.focus();
      }

      function persistSavedNotes() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(savedNotes));
          return true;
        } catch (error) {
          console.error("Saved notes could not be stored:", error);
          savedFeedback.textContent = "ブラウザへの保存に失敗しました。プライベートブラウズや保存容量の設定を確認してください。";
          savedFeedback.classList.add("error");
          return false;
        }
      }

      function updateSavedFeedback(message, isError) {
        savedFeedback.textContent = message;
        savedFeedback.classList.toggle("error", Boolean(isError));
      }

      function formatSavedDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "保存日時不明";
        return date.toLocaleString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function renderSavedNotes() {
        savedNotesContainer.replaceChildren();
        memoMenuCount.textContent = savedNotes.length.toLocaleString("ja-JP");
        memoDrawerToggle.setAttribute("aria-label", "保存したメモを開く（" + savedNotes.length + "件）");
        savedExportButton.disabled = savedNotes.length === 0;
        savedFavoritesFilter.setAttribute("aria-pressed", String(favoritesOnly));
        savedFavoritesFilter.textContent = favoritesOnly ? "★ お気に入りのみ" : "☆ お気に入り";

        const query = savedSearchInput.value.trim().toLocaleLowerCase("ja-JP");
        let visibleNotes = savedNotes.filter(function (note) {
          const searchableText = (note.title || "") + "\n" + (note.content || "");
          const matchesQuery = !query || searchableText.toLocaleLowerCase("ja-JP").includes(query);
          const matchesFavorite = !favoritesOnly || Boolean(note.favorite);
          return matchesQuery && matchesFavorite;
        });

        const sortMode = savedSortSelect.value;
        visibleNotes.sort(function (a, b) {
          if (sortMode === "title-asc") {
            return (a.title || "").localeCompare(b.title || "", "ja");
          }
          if (sortMode === "created-asc") {
            return new Date(a.savedAt || 0).getTime() - new Date(b.savedAt || 0).getTime();
          }
          return new Date(b.updatedAt || b.savedAt || 0).getTime()
            - new Date(a.updatedAt || a.savedAt || 0).getTime();
        });

        const isFiltered = Boolean(query) || favoritesOnly;
        savedCount.textContent = isFiltered
          ? visibleNotes.length.toLocaleString("ja-JP") + " / " + savedNotes.length.toLocaleString("ja-JP") + " 件"
          : savedNotes.length.toLocaleString("ja-JP") + " 件";

        if (savedNotes.length === 0) {
          const empty = document.createElement("div");
          empty.className = "saved-empty";
          empty.textContent = "保存したメモはまだありません。入力欄に内容を書き、「保存」を押してください。";
          savedNotesContainer.appendChild(empty);
          return;
        }

        if (visibleNotes.length === 0) {
          const empty = document.createElement("div");
          empty.className = "saved-empty";
          empty.textContent = favoritesOnly && !query
            ? "お気に入りに登録したメモはありません。各メモの☆ボタンで登録できます。"
            : "検索条件に一致するメモはありません。キーワードやお気に入り条件を変更してください。";
          savedNotesContainer.appendChild(empty);
          return;
        }

        visibleNotes.forEach(function (note) {
          const article = document.createElement("article");
          article.className = "saved-note";

          const header = document.createElement("div");
          header.className = "saved-note-header";

          const title = document.createElement("h3");
          title.className = "saved-note-title";
          title.textContent = note.title || "無題のメモ";

          const titleHeading = document.createElement("div");
          titleHeading.className = "saved-note-heading";
          const excerpt = document.createElement("span");
          excerpt.className = "saved-note-excerpt";
          const openingText = (note.content || "").trim().replace(/\\s+/g, " ");
          const openingCharacters = Array.from(openingText);
          excerpt.textContent = openingCharacters.length > 64
            ? openingCharacters.slice(0, 64).join("") + "…"
            : openingText;
          excerpt.title = openingText;
          titleHeading.append(title, excerpt);

          const actions = document.createElement("div");
          actions.className = "saved-note-actions";

          const favoriteButton = document.createElement("button");
          favoriteButton.type = "button";
          favoriteButton.className = "saved-note-favorite";
          favoriteButton.textContent = note.favorite ? "★" : "☆";
          favoriteButton.title = note.favorite ? "お気に入りから外す" : "お気に入りに登録";
          favoriteButton.setAttribute("aria-label", favoriteButton.title);
          favoriteButton.setAttribute("aria-pressed", String(Boolean(note.favorite)));
          favoriteButton.addEventListener("click", function () {
            note.favorite = !Boolean(note.favorite);
            const stored = persistSavedNotes();
            renderSavedNotes();
            updateSavedFeedback(
              stored
                ? "「" + (note.title || "無題のメモ") + "」を" + (note.favorite ? "お気に入りに追加" : "お気に入りから解除") + "しました。"
                : "お気に入り状態を変更しましたが、ブラウザへの保存に失敗しました。",
              !stored
            );
          });

          const body = document.createElement("div");
          body.className = "saved-note-expanded";
          body.hidden = true;

          const openButton = document.createElement("button");
          openButton.type = "button";
          openButton.textContent = "開く";
          openButton.setAttribute("aria-expanded", "false");
          openButton.addEventListener("click", function () {
            body.hidden = !body.hidden;
            openButton.textContent = body.hidden ? "開く" : "閉じる";
            openButton.setAttribute("aria-expanded", String(!body.hidden));
          });

          const copyButton = document.createElement("button");
          copyButton.type = "button";
          copyButton.textContent = "コピー";
          copyButton.addEventListener("click", function () {
            copyTextToClipboard(note.content)
              .then(function () {
                updateSavedFeedback("「" + (note.title || "無題のメモ") + "」の内容をコピーしました。", false);
              })
              .catch(function (error) {
                console.error("Clipboard copy failed:", error);
                updateSavedFeedback("コピーできませんでした。ブラウザのクリップボード利用設定を確認してください。", true);
              });
          });

          const duplicateButton = document.createElement("button");
          duplicateButton.type = "button";
          duplicateButton.textContent = "複製";
          duplicateButton.addEventListener("click", function () {
            const baseTitle = note.title || "無題のメモ";
            let duplicateTitle = baseTitle + "（コピー）";
            let suffix = 2;
            while (savedNotes.some(function (item) { return item.title === duplicateTitle; })) {
              duplicateTitle = baseTitle + "（コピー " + suffix + "）";
              suffix += 1;
            }
            const now = new Date().toISOString();
            const duplicate = {
              id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9),
              title: duplicateTitle,
              content: note.content || "",
              savedAt: now,
              updatedAt: now,
              favorite: false
            };
            savedNotes.unshift(duplicate);
            const stored = persistSavedNotes();
            renderSavedNotes();
            updateSavedFeedback(
              stored ? "「" + duplicateTitle + "」を作成しました。" : "複製を一覧に追加しましたが、ブラウザへの保存に失敗しました。",
              !stored
            );
          });

          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "編集欄に戻す";
          editButton.addEventListener("click", function () {
            closeMemoDrawer(false);
            setEditorContent(note.content);
            setEditingNote(note);
            focusEditor();
            document.querySelector(".editor-panel").scrollIntoView({
              behavior: "smooth",
              block: "start"
            });
            updateSavedFeedback("「" + (note.title || "無題のメモ") + "」を編集中です。編集後は「上書き保存」を押してください。", false);
            setStatus("「" + (note.title || "無題のメモ") + "」を編集中", false);
          });

          actions.append(favoriteButton, openButton, copyButton, duplicateButton, editButton);
          header.append(titleHeading, actions);

          const renderedContent = document.createElement("div");
          renderedContent.className = "saved-note-content saved-note-rendered";
          renderMathContent(renderedContent, note.content || "");

          const detailFooter = document.createElement("div");
          detailFooter.className = "saved-note-detail-footer";

          const date = document.createElement("time");
          date.className = "saved-note-date";
          date.dateTime = note.updatedAt || note.savedAt || "";
          date.textContent = (note.updatedAt && note.updatedAt !== note.savedAt)
            ? "最終更新： " + formatSavedDate(note.updatedAt)
            : "保存日時： " + formatSavedDate(note.savedAt);

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.textContent = "削除";
          deleteButton.addEventListener("click", function () {
            const deletingActiveNote = editingNoteId === note.id;
            savedNotes = savedNotes.filter(function (item) {
              return item.id !== note.id;
            });
            const stored = persistSavedNotes();
            if (deletingActiveNote) setEditingNote(null);
            renderSavedNotes();
            updateSavedFeedback(
              stored ? "「" + (note.title || "無題のメモ") + "」を削除しました。" : "一覧から削除しましたが、ブラウザへの保存更新に失敗しました。",
              !stored
            );
          });

          detailFooter.append(date, deleteButton);
          body.append(renderedContent, detailFooter);
          article.append(header, body);
          savedNotesContainer.appendChild(article);
        });
      }

      function exportSavedNotes() {
        if (!savedNotes.length) {
          updateSavedFeedback("バックアップするメモがありません。", true);
          return;
        }
        const backup = {
          format: "latex-memo-backup",
          version: 1,
          exportedAt: new Date().toISOString(),
          notes: savedNotes
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], {
          type: "application/json;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const stamp = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = "latex-memo-backup-" + stamp + ".json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        updateSavedFeedback("保存したメモ " + savedNotes.length + " 件をJSON形式でバックアップしました。", false);
      }

      function fallbackCopyText(text) {
        return new Promise(function (resolve, reject) {
          const temporary = document.createElement("textarea");
          temporary.value = text;
          temporary.setAttribute("readonly", "");
          temporary.style.position = "fixed";
          temporary.style.opacity = "0";
          temporary.style.pointerEvents = "none";
          document.body.appendChild(temporary);
          temporary.focus();
          temporary.select();

          let copied = false;
          try {
            copied = document.execCommand("copy");
          } catch (error) {
            copied = false;
          }
          temporary.remove();

          if (copied) resolve();
          else reject(new Error("Clipboard copy is unavailable."));
        });
      }

      function copyTextToClipboard(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          return navigator.clipboard.writeText(text).catch(function () {
            return fallbackCopyText(text);
          });
        }
        return fallbackCopyText(text);
      }

      function copyCurrentText() {
        const text = source.value;
        if (!text) {
          setStatus("コピーする内容がありません", true);
          return;
        }
        copyTextToClipboard(text)
          .then(function () {
            setStatus("入力内容をクリップボードにコピーしました", false);
          })
          .catch(function (error) {
            console.error("Current source copy failed:", error);
            setStatus("コピーできませんでした。ブラウザのクリップボード利用設定を確認してください", true);
          });
      }

      function saveCurrentNote() {
        const text = source.value;
        if (!text.trim()) {
          updateSavedFeedback("空の内容は保存できません。先に入力欄へ内容を書いてください。", true);
          focusEditor();
          return;
        }

        const enteredTitle = window.prompt("保存するメモのタイトルを入力してください。", "");
        if (enteredTitle === null) return;
        const title = enteredTitle.trim();
        if (!title) {
          updateSavedFeedback("タイトルが空欄のため、保存しませんでした。", true);
          return;
        }

        const now = new Date().toISOString();
        const note = {
          id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9),
          title: title,
          content: text,
          savedAt: now,
          updatedAt: now
        };

        savedNotes.unshift(note);
        setEditingNote(note);
        const stored = persistSavedNotes();
        renderSavedNotes();

        if (stored) {
          updateSavedFeedback("「" + title + "」を保存しました。続けて編集し、「上書き保存」で更新できます。", false);
          setStatus("「" + title + "」を保存しました", false);
        } else {
          updateSavedFeedback("一覧には追加しましたが、ブラウザに永続保存できませんでした。", true);
          setStatus("ブラウザへの保存に失敗しました", true);
        }
      }

      function overwriteCurrentNote() {
        if (!editingNoteId) {
          saveCurrentNote();
          return;
        }
        const text = source.value;
        if (!text.trim()) {
          updateSavedFeedback("空の内容では上書き保存できません。", true);
          focusEditor();
          return;
        }

        const note = savedNotes.find(function (item) { return item.id === editingNoteId; });
        if (!note) {
          setEditingNote(null);
          updateSavedFeedback("元の保存先が見つからないため、新しいメモとして保存します。", true);
          saveCurrentNote();
          return;
        }

        note.content = text;
        note.updatedAt = new Date().toISOString();
        const stored = persistSavedNotes();
        renderSavedNotes();
        updateSavedFeedback(
          stored ? "「" + note.title + "」を上書き保存しました。" : "画面上では更新しましたが、ブラウザへの保存に失敗しました。",
          !stored
        );
        setStatus(
          stored ? "「" + note.title + "」を上書き保存しました" : "ブラウザへの保存に失敗しました",
          !stored
        );
      }

      function renameCurrentNote() {
        if (!editingNoteId) return;

        const note = savedNotes.find(function (item) { return item.id === editingNoteId; });
        if (!note) {
          setEditingNote(null);
          updateSavedFeedback("編集対象のメモが見つかりません。保存一覧を確認してください。", true);
          return;
        }

        const enteredTitle = window.prompt("新しい保存名を入力してください。", note.title || "");
        if (enteredTitle === null) return;
        const title = enteredTitle.trim();
        if (!title) {
          updateSavedFeedback("保存名が空欄のため、変更しませんでした。", true);
          return;
        }

        note.title = title;
        note.updatedAt = new Date().toISOString();
        const stored = persistSavedNotes();
        setEditingNote(note);
        renderSavedNotes();
        updateSavedFeedback(
          stored ? "保存名を「" + title + "」に変更しました。" : "画面上では名前を変更しましたが、ブラウザへの保存に失敗しました。",
          !stored
        );
        setStatus(
          stored ? "保存名を「" + title + "」に変更しました" : "ブラウザへの保存に失敗しました",
          !stored
        );
      }

      function setStatus(message, isError) {
        status.classList.toggle("error", Boolean(isError));
        statusText.textContent = message;
      }

      function appendText(target, text) {
        if (text) target.appendChild(document.createTextNode(text));
      }

      function appendFormula(target, expression, displayMode) {
        const container = document.createElement(displayMode ? "div" : "span");
        if (displayMode) container.className = "math-display-wrapper";
        target.appendChild(container);
        try {
          window.katex.render(expression, container, {
            displayMode: displayMode,
            throwOnError: false,
            strict: "ignore",
            output: "htmlAndMathml"
          });
        } catch (error) {
          container.textContent = expression;
          console.error("KaTeX render error:", error);
        }
      }

      function looksLikeMarkdown(text) {
        return /(^|\n)\s{0,3}(#{1,6}\s|>\s|[-*+]\s|\d+[.)]\s|([-*_]){3,}\s*$|\|.*\|\s*$|\x60{3})|\*\*[^*]+\*\*|__[^_]+__|~~[^~]+~~|\[[^\]]+\]\([^)]+\)|(^|[^\\])\x60[^\x60]+\x60/m.test(text);
      }

      function renderMathInTextNode(node) {
        const text = node.nodeValue;
        const pattern = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+\$)/g;
        const matches = Array.from(text.matchAll(pattern));
        if (!matches.length) return;

        const fragment = document.createDocumentFragment();
        let cursor = 0;
        matches.forEach(function (match) {
          appendText(fragment, text.slice(cursor, match.index));
          const token = match[0];
          let expression = token;
          let displayMode = false;
          if (token.startsWith("$$") && token.endsWith("$$")) {
            expression = token.slice(2, -2);
            displayMode = true;
          } else if (token.startsWith("\\[") && token.endsWith("\\]")) {
            expression = token.slice(2, -2);
            displayMode = true;
          } else if (token.startsWith("\\(") && token.endsWith("\\)")) {
            expression = token.slice(2, -2);
          } else {
            expression = token.slice(1, -1);
          }
          appendFormula(fragment, expression, displayMode);
          cursor = match.index + token.length;
        });
        appendText(fragment, text.slice(cursor));
        node.parentNode.replaceChild(fragment, node);
      }

      function renderMarkdownContent(target, text) {
        if (!window.marked || !window.DOMPurify) {
          target.textContent = text;
          return false;
        }

        // Protect math before Markdown parsing so multiline display math isn't split across HTML nodes.
        const mathTokens = [];
        const mathPattern = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+\$)/g;
        const protectedText = text.replace(mathPattern, function (token) {
          const placeholder = "MATHPLACEHOLDER" + mathTokens.length + "ENDTOKEN";
          let expression = token;
          let displayMode = false;
          if (token.startsWith("$$") && token.endsWith("$$")) {
            expression = token.slice(2, -2);
            displayMode = true;
          } else if (token.startsWith("\\[") && token.endsWith("\\]")) {
            expression = token.slice(2, -2);
            displayMode = true;
          } else if (token.startsWith("\\(") && token.endsWith("\\)")) {
            expression = token.slice(2, -2);
          } else {
            expression = token.slice(1, -1);
          }
          mathTokens.push({ placeholder, expression, displayMode });
          return placeholder;
        });

        const html = window.marked.parse(protectedText, { gfm: true, breaks: false });
        target.innerHTML = window.DOMPurify.sanitize(html, {
          USE_PROFILES: { html: true }
        });

        if (mathTokens.length) {
          const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
          const nodes = [];
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement && !node.parentElement.closest("code, pre, script, style")) {
              nodes.push(node);
            }
          }
          nodes.forEach(function (textNode) {
            const value = textNode.nodeValue;
            const fragment = document.createDocumentFragment();
            let cursor = 0;
            let found = false;
            mathTokens.forEach(function (item) {
              const index = value.indexOf(item.placeholder, cursor);
              if (index < 0) return;
              found = true;
              appendText(fragment, value.slice(cursor, index));
              appendFormula(fragment, item.expression, item.displayMode);
              cursor = index + item.placeholder.length;
            });
            if (found) {
              appendText(fragment, value.slice(cursor));
              textNode.parentNode.replaceChild(fragment, textNode);
            }
          });
        }
        target.classList.add("markdown-rendered");
        return true;
      }

      function renderMathContent(target, text) {
        target.replaceChildren();
        if (!text.trim()) return;

        if (!window.katex || typeof window.katex.render !== "function") {
          target.textContent = text;
          return;
        }

        if (looksLikeMarkdown(text) && window.marked && window.DOMPurify) {
          renderMarkdownContent(target, text);
          return;
        }
        target.classList.remove("markdown-rendered");

        const pattern = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+\$)/g;
        const matches = Array.from(text.matchAll(pattern));
        if (!matches.length) {
          target.textContent = text;
          return;
        }

        let cursor = 0;
        matches.forEach(function (match) {
          appendText(target, text.slice(cursor, match.index));
          const token = match[0];
          let expression = token;
          let displayMode = false;
          if (token.startsWith("$$") && token.endsWith("$$")) {
            expression = token.slice(2, -2);
            displayMode = true;
          } else if (token.startsWith("\\[") && token.endsWith("\\]")) {
            expression = token.slice(2, -2);
            displayMode = true;
          } else if (token.startsWith("\\(") && token.endsWith("\\)")) {
            expression = token.slice(2, -2);
          } else {
            expression = token.slice(1, -1);
          }
          appendFormula(target, expression, displayMode);
          cursor = match.index + token.length;
        });
        appendText(target, text.slice(cursor));
      }

      function containsUndelimitedLatex(text) {
        const mathPattern = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+\$)/g;
        const withoutDelimitedMath = text
          .replace(/\x60{3}[\s\S]*?\x60{3}/g, " ")
          .replace(/\x60[^\x60]*\x60/g, " ")
          .replace(mathPattern, " ");
        return /\\(?:sum|prod|int|frac|dfrac|tfrac|sqrt|lim|sin|cos|tan|log|ln|alpha|beta|gamma|theta|pi|infty|cdot|times|pm|leq|geq|neq|in|notin|subset|cup|cap|begin|end|left|right|mathbf|mathrm|text|partial|nabla|overline|underline|binom)\b|(?:\^\{[^}]+\}|_\{[^}]+\})/.test(withoutDelimitedMath);
      }

      function renderPreview() {
        const text = source.value;
        const characterLength = Array.from(text).length;
        charCount.textContent = characterLength.toLocaleString("ja-JP") + " 文字";
        currentCharacterCount.textContent = characterLength.toLocaleString("ja-JP") + " 文字";
        renderMathContent(preview, text);

        if (!text.trim()) {
          setStatus("入力待ち", false);
          return;
        }

        if (!window.katex || typeof window.katex.render !== "function") {
          setStatus("KaTeXを読み込めません。通信を確認してください", true);
          return;
        }

        if (containsUndelimitedLatex(text)) {
          setStatus("数式には区切り記号が必要です（例：$$ ... $$ または $ ... $）", true);
          return;
        }

        const hasFormulaError = Boolean(preview.querySelector(".katex-error"));
        setStatus(
          hasFormulaError ? "式の記法を確認してください" : "Markdown・数式を描画済み",
          hasFormulaError
        );
      }

      async function initializeCodeMirror() {
        try {
          const [stateModule, viewModule, commandsModule] = await Promise.all([
            import("https://esm.sh/@codemirror/state@6.7.1"),
            import("https://esm.sh/@codemirror/view@6.43.9?deps=@codemirror/state@6.7.1"),
            import("https://esm.sh/@codemirror/commands@6.11.0?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.9")
          ]);
          const EditorState = stateModule.EditorState;
          const EditorView = viewModule.EditorView;

          const missingApis = [];
          if (!EditorState) missingApis.push("EditorState");
          if (!EditorView) missingApis.push("EditorView");
          if (typeof viewModule.drawSelection !== "function") missingApis.push("drawSelection");
          if (!EditorView || !EditorView.clickAddsSelectionRange ||
              typeof EditorView.clickAddsSelectionRange.of !== "function") {
            missingApis.push("EditorView.clickAddsSelectionRange");
          }
          if (!viewModule.keymap || typeof viewModule.keymap.of !== "function") missingApis.push("keymap");
          if (typeof commandsModule.history !== "function") missingApis.push("history");
          if (!Array.isArray(commandsModule.defaultKeymap)) missingApis.push("defaultKeymap");
          if (!Array.isArray(commandsModule.historyKeymap)) missingApis.push("historyKeymap");
          if (missingApis.length) {
            throw new Error("CodeMirror の必要なAPIが見つかりません: " + missingApis.join(", "));
          }

          editorView = new EditorView({
            doc: source.value,
            parent: sourceEditorHost,
            extensions: [
              // Enable multi-range selections and draw every cursor.
              EditorState.allowMultipleSelections.of(true),
              viewModule.drawSelection(),
              EditorView.lineWrapping,
              commandsModule.history(),
              viewModule.keymap.of([
                ...commandsModule.defaultKeymap,
                ...commandsModule.historyKeymap
              ]),
              // Do not enable rectangularSelection here: Option-click is reserved
              // for adding a separate cursor, as in common code editors.
              EditorView.clickAddsSelectionRange.of(function (event) {
                return event.altKey;
              }),
              EditorView.theme({
                "&": {
                  height: "100%",
                  minHeight: "100%"
                },
                ".cm-content": {
                  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
                },
                ".cm-cursor": {
                  borderLeftColor: "#4658d8"
                }
              }),
              EditorView.updateListener.of(function (update) {
                if (!update.docChanged) return;
                source.value = update.state.doc.toString();
                renderPreview();
              })
            ]
          });
          return true;
        } catch (error) {
          console.error("CodeMirror could not be loaded; using a standard textarea.", error);
          if (editorView) {
            editorView.destroy();
            editorView = null;
          }
          sourceEditorHost.hidden = true;
          source.hidden = false;
          source.addEventListener("input", renderPreview);
          const reason = error && error.message ? "（" + error.message + "）" : "";
          updateSavedFeedback("複数カーソルエディタの初期化に失敗したため、通常の入力欄に切り替えました。" + reason, true);
          return false;
        }
      }

      memoDrawerToggle.addEventListener("click", function () {
        if (memoDrawer.classList.contains("is-open")) closeMemoDrawer(false);
        else openMemoDrawer();
      });
      savedSearchInput.addEventListener("input", renderSavedNotes);
      savedSortSelect.addEventListener("change", renderSavedNotes);
      savedFavoritesFilter.addEventListener("click", function () {
        favoritesOnly = !favoritesOnly;
        renderSavedNotes();
      });
      savedExportButton.addEventListener("click", exportSavedNotes);
      closeMemoDrawerButton.addEventListener("click", function () {
        closeMemoDrawer(true);
      });
      memoDrawerBackdrop.addEventListener("click", function () {
        closeMemoDrawer(true);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && memoDrawer.classList.contains("is-open")) {
          closeMemoDrawer(true);
          return;
        }
        const target = event.target;
        const isTyping = target && (
          target.matches("input, textarea, select") || target.isContentEditable
        );
        if (event.key === "/" && memoDrawer.classList.contains("is-open") &&
            !isTyping && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          savedSearchInput.focus();
        }
      });

      saveButton.addEventListener("click", saveCurrentNote);
      overwriteSaveButton.addEventListener("click", overwriteCurrentNote);
      renameSaveButton.addEventListener("click", renameCurrentNote);
      copyCurrentButton.addEventListener("click", copyCurrentText);
      sampleButton.addEventListener("click", function () {
        setEditingNote(null);
        setEditorContent(sample);
        focusEditor();
      });
      clearButton.addEventListener("click", function () {
        setEditingNote(null);
        setEditorContent("");
        focusEditor();
      });

      source.value = sample;
      preview.textContent = sample;
      setEditingNote(null);
      renderSavedNotes();
      setStatus("KaTeXを読み込み中…", false);

      const codeMirrorReady = initializeCodeMirror();
      Promise.all([loadKatex(), loadMarkdownLibraries(), codeMirrorReady])
        .then(function () {
          renderPreview();
          renderSavedNotes();
        })
        .catch(function (error) {
          preview.textContent = source.value;
          setStatus("描画ライブラリを読み込めません。通信を確認してください", true);
          console.error(error);
        });
    });
  </script>
</body>
</html>
